<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Faerie Dice is a tool for rolling dice with weighted probabilities.">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@600;700&display=swap"
    rel="stylesheet" />
  <title>Faerie Dice</title>
</head>

<body>
  <header class="topbar">
    <div class="brand">Faerie Dice</div>
    <button
      type="button"
      id="probability-toggle"
      class="probability-toggle"
      aria-expanded="false"
      aria-controls="probability-drawer"
    >
      Probability
    </button>
  </header>

  <div class="shell">
    <aside class="dice-tray" aria-label="Dice type">
      <div class="dice-tray-heading">
        <span class="dice-tray-title">Dice</span>
        <span class="dice-tray-sub">Quick tray</span>
      </div>
      <ul class="die-select" id="die-select"></ul>
    </aside>

    <main id="app">
      <section class="stage" aria-live="polite">
        <div class="result-die" id="result-die" data-die="d20">
          <div class="result-die-shape" id="result-die-shape" aria-hidden="true"></div>
          <p class="result-hero" id="result-value">—</p>
        </div>
        <p class="result-meta" id="result-meta">Roll to begin.</p>
      </section>

      <section class="tray">
        <div class="tray-grid">
          <div class="control-block">
            <label class="control-label" for="number-of-rolls">Number of rolls</label>
            <div class="stepper">
              <button type="button" id="rolls-dec" class="stepper-btn" aria-label="Decrease rolls">−</button>
              <input type="number" id="number-of-rolls" min="1" max="100" value="1" />
              <button type="button" id="rolls-inc" class="stepper-btn" aria-label="Increase rolls">+</button>
            </div>
          </div>

          <div class="control-block">
            <span class="control-label" id="mode-label">Mode</span>
            <div class="listbox" id="mode-listbox-root">
              <button
                type="button"
                class="listbox-trigger"
                id="mode-trigger"
                aria-haspopup="listbox"
                aria-expanded="false"
                aria-controls="mode-listbox"
                aria-labelledby="mode-label mode-trigger"
              >Weighted</button>
              <ul class="listbox-options" id="mode-listbox" role="listbox" aria-labelledby="mode-label" hidden>
                <li role="option" data-value="fair" aria-selected="false" tabindex="-1">Normal</li>
                <li role="option" data-value="weighted" aria-selected="true" tabindex="-1">Weighted</li>
              </ul>
            </div>
          </div>

          <div class="control-block">
            <span class="control-label" id="aggregation-label">Aggregation</span>
            <div class="listbox" id="aggregation-listbox-root">
              <button
                type="button"
                class="listbox-trigger"
                id="aggregation-trigger"
                aria-haspopup="listbox"
                aria-expanded="false"
                aria-controls="aggregation-listbox"
                aria-labelledby="aggregation-label aggregation-trigger"
              >None</button>
              <ul class="listbox-options" id="aggregation-listbox" role="listbox" aria-labelledby="aggregation-label" hidden>
                <li role="option" data-value="" aria-selected="true" tabindex="-1">None</li>
                <li role="option" data-value="advantage" aria-selected="false" tabindex="-1">Advantage</li>
                <li role="option" data-value="disadvantage" aria-selected="false" tabindex="-1">Disadvantage</li>
                <li role="option" data-value="sum" aria-selected="false" tabindex="-1">Sum</li>
              </ul>
            </div>
          </div>
        </div>

        <div class="tray-actions">
          <button type="button" id="roll-btn">Roll</button>
        </div>
      </section>
    </main>

    <aside
      class="probability"
      id="probability-drawer"
      aria-label="Face weights"
      data-open="false"
    >
      <div class="probability-header">
        <div class="probability-heading">
          <h2 class="control-label">Probability engine</h2>
          <span class="probability-config" id="probability-config">Current config: 1d20</span>
        </div>
        <div class="probability-header-actions">
          <button type="button" id="reset-btn" class="secondary">Reset weights</button>
          <button type="button" id="probability-close" class="probability-close" aria-label="Close probability engine">
            Close
          </button>
        </div>
      </div>
      <ul class="weights" id="weights"></ul>
    </aside>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
